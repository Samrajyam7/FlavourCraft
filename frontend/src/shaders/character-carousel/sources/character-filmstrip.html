<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8c9ad">
  <title>FlavorCraft — Discover Your Next Dish</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      background: #d8c9ad;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d8c9ad;
    }

    body {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .stage {
      --pointer-x: 50%;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 440px;
      overflow: hidden;
      isolation: isolate;
      perspective: 1450px;
      cursor: ew-resize;
      touch-action: none;
      background:
        linear-gradient(90deg, rgba(80, 58, 31, 0.08) 1px, transparent 1px) 50% 0 / 25% 100%,
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 109px,
          rgba(72, 52, 30, 0.13) 110px,
          transparent 111px
        ),
        radial-gradient(circle at var(--pointer-x) 48%, rgba(255, 246, 220, 0.78), transparent 34%),
        #d8c9ad;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0.27;
      background:
        repeating-radial-gradient(circle at 12% 18%, rgba(71, 51, 30, 0.17) 0 0.5px, transparent 0.7px 4px),
        repeating-radial-gradient(circle at 78% 71%, rgba(255, 255, 255, 0.35) 0 0.5px, transparent 0.8px 5px);
      mix-blend-mode: multiply;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        rgba(84, 58, 29, 0.19),
        transparent 14%,
        transparent 86%,
        rgba(84, 58, 29, 0.19)
      );
    }

    .deck {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform-style: preserve-3d;
    }

    .card {
      --focus: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(154px, 16.8vw, 238px);
      aspect-ratio: 0.72;
      padding: 7px;
      overflow: hidden;
      border: 1px solid rgba(47, 34, 19, 0.42);
      border-radius: 4px;
      color: #f3e7ce;
      background: #e7d9bd;
      box-shadow:
        0 calc(10px + var(--focus) * 24px) calc(18px + var(--focus) * 36px)
          rgba(57, 38, 19, calc(0.2 + var(--focus) * 0.26)),
        inset 0 0 0 1px rgba(255, 255, 255, 0.64);
      appearance: none;
      outline: none;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      cursor: pointer;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 5px;
      z-index: 3;
      border: 1px solid rgba(28, 22, 14, calc(0.12 + var(--focus) * 0.12));
      pointer-events: none;
    }

    .card:focus-visible {
      box-shadow:
        0 26px 50px rgba(57, 38, 19, 0.42),
        0 0 0 4px rgba(197, 79, 25, 0.34);
    }

    .portrait {
      position: absolute;
      inset: 7px 7px 25%;
      overflow: hidden;
      background: #766a58;
    }

    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(calc(1.04 + (1 - var(--focus)) * 0.06));
      filter:
        sepia(calc((1 - var(--focus)) * 0.12))
        saturate(calc(0.85 + var(--focus) * 0.25))
        contrast(1.04);
    }

    .footer {
      position: absolute;
      right: 7px;
      bottom: 7px;
      left: 7px;
      height: calc(25% - 7px);
      display: grid;
      grid-template-columns: clamp(26px, 3.2vw, 43px) 1fr;
      align-items: center;
      gap: clamp(6px, 0.7vw, 11px);
      padding: clamp(7px, 0.8vw, 12px);
      color: #f0dfc2;
      background: #171612;
      text-align: left;
    }

    .index {
      display: grid;
      width: clamp(23px, 2.7vw, 37px);
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid #ce5d20;
      border-radius: 50%;
      color: #d86724;
      font: 600 clamp(7px, 0.68vw, 11px)/1 ui-monospace, "SFMono-Regular", monospace;
    }

    .meta {
      min-width: 0;
    }

    .name,
    .role {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .name {
      color: #f3e6cc;
      font-size: clamp(8px, 0.86vw, 13px);
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.1;
    }

    .role {
      margin-top: clamp(3px, 0.35vw, 5px);
      color: #d46a27;
      font-size: clamp(5px, 0.48vw, 7px);
      font-weight: 700;
      letter-spacing: 0.15em;
      line-height: 1;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 650px) {
      .stage {
        min-height: 560px;
        cursor: ns-resize;
        background:
          linear-gradient(90deg, rgba(80, 58, 31, 0.08) 1px, transparent 1px) 50% 0 / 50% 100%,
          repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 87px,
            rgba(72, 52, 30, 0.13) 88px,
            transparent 89px
          ),
          radial-gradient(circle at 50% 50%, rgba(255, 246, 220, 0.78), transparent 35%),
          #d8c9ad;
      }

      .card {
        width: clamp(142px, 47vw, 180px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        will-change: auto;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Interactive FlavorCraft culinary dish filmstrip">
    <h1 class="sr-only">FlavorCraft Culinary Filmstrip</h1>
    <p class="sr-only">Move, scroll, or use the arrow keys to explore signature dishes.</p>
    <div class="deck" id="deck" data-testid="filmstrip"></div>
  </main>

  <script>
    (() => {
      const defaultPortraits = {
        butter_chicken: "https://images.unsplash.com/photo-1603894584373-5ac82b2b3a98?w=600&auto=format&fit=crop&q=80",
        biryani: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=600&auto=format&fit=crop&q=80",
        pasta: "https://images.unsplash.com/photo-1612874742237-6526221469e3?w=600&auto=format&fit=crop&q=80",
        pizza: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600&auto=format&fit=crop&q=80",
        fried_rice: "https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=600&auto=format&fit=crop&q=80",
        paneer_tikka: "https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=600&auto=format&fit=crop&q=80",
        palak_paneer: "https://images.unsplash.com/photo-1601050690597-df0568f6a7d5?w=600&auto=format&fit=crop&q=80",
        dal_makhani: "https://images.unsplash.com/photo-1546833999-b9f581a19902?w=600&auto=format&fit=crop&q=80"
      };

      const profiles = (window.__FLAVORCRAFT_ITEMS || [
        ["Butter Chicken", "Murgh Makhani", defaultPortraits.butter_chicken],
        ["Hyderabadi Biryani", "Royal Dum Biryani", defaultPortraits.biryani],
        ["Pasta Carbonara", "Italian Classic", defaultPortraits.pasta],
        ["Artisan Pizza", "Wood-Fired Neapolitan", defaultPortraits.pizza],
        ["Vegetable Fried Rice", "Wok-Tossed Fragrant", defaultPortraits.fried_rice],
        ["Paneer Tikka", "Tandoori Spiced", defaultPortraits.paneer_tikka],
        ["Palak Paneer", "Spinach & Herb Curry", defaultPortraits.palak_paneer],
        ["Dal Makhani", "Slow-Simmered Lentils", defaultPortraits.dal_makhani]
      ]).map(([name, role, portrait]) => ({
        name,
        role,
        portrait: defaultPortraits[portrait] || portrait
      }));

      const stage = document.querySelector("#stage");
      const deck = document.querySelector("#deck");
      const cards = profiles.map((profile, index) => {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.dataset.index = String(index);
        card.setAttribute("aria-label", `Focus ${profile.name}, ${profile.role}`);
        card.innerHTML = `
          <span class="portrait">
            <img src="${profile.portrait}" alt="${profile.name}" loading="lazy">
          </span>
          <span class="footer">
            <span class="index">${String(index + 1).padStart(2, "0")}</span>
            <span class="meta">
              <span class="name">${profile.name}</span>
              <span class="role">${profile.role}</span>
            </span>
          </span>`;
        deck.append(card);
        return card;
      });

      const count = cards.length;
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const state = {
        phase: 3,
        target: 3,
        base: 3,
        pointerX: 0,
        pointerY: 0,
        active: false,
        lastInput: performance.now()
      };

      function wrappedDelta(index, phase) {
        let delta = index - phase;
        while (delta > count / 2) delta -= count;
        while (delta < -count / 2) delta += count;
        return delta;
      }

      function nearestIndex() {
        return (Math.round(state.phase) % count + count) % count;
      }

      function moveTo(index) {
        const current = nearestIndex();
        let delta = index - current;
        if (delta > count / 2) delta -= count;
        if (delta < -count / 2) delta += count;
        state.base += delta;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      }

      cards.forEach((card, index) => {
        card.addEventListener("click", () => moveTo(index));
        card.addEventListener("focus", () => moveTo(index));
      });

      stage.addEventListener("pointermove", (event) => {
        const rect = stage.getBoundingClientRect();
        const nx = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - 0.5) * 2));
        const ny = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - 0.5) * 2));
        state.pointerX = nx;
        state.pointerY = ny;
        state.active = true;
        state.target = state.base + (innerWidth < 650 ? ny * 2.2 : nx * 3.1);
        state.lastInput = performance.now();
        stage.style.setProperty("--pointer-x", `${(nx + 1) * 50}%`);
      });

      stage.addEventListener("pointerleave", () => {
        state.active = false;
        state.pointerX = 0;
        state.pointerY = 0;
        state.target = state.base;
        stage.style.setProperty("--pointer-x", "50%");
      });

      stage.addEventListener("wheel", (event) => {
        event.preventDefault();
        const direction = Math.sign(Math.abs(event.deltaY) > Math.abs(event.deltaX) ? event.deltaY : event.deltaX);
        if (!direction) return;
        state.base += direction;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      }, { passive: false });

      addEventListener("keydown", (event) => {
        const forward = event.key === "ArrowRight" || event.key === "ArrowDown";
        const backward = event.key === "ArrowLeft" || event.key === "ArrowUp";
        if (!forward && !backward) return;
        event.preventDefault();
        state.base += forward ? 1 : -1;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      });

      let previousTime = performance.now();

      function render(time) {
        const deltaTime = Math.min(32, time - previousTime);
        previousTime = time;
        const ease = reducedMotion ? 1 : 1 - Math.pow(0.001, deltaTime / 1000);

        if (!state.active && time - state.lastInput > 3600) {
          const idle = time - state.lastInput - 3600;
          state.target = state.base + Math.sin(idle * 0.00042) * 2.45;
        }

        state.phase += (state.target - state.phase) * ease;
        const compact = innerWidth < 650;
        const activeIndex = nearestIndex();
        const horizontalSpacing = Math.min(168, Math.max(112, innerWidth * 0.116));
        const verticalSpacing = Math.min(122, Math.max(88, innerHeight * 0.112));

        cards.forEach((card, index) => {
          const delta = wrappedDelta(index, state.phase);
          const distance = Math.abs(delta);
          const focus = Math.exp(-distance * distance * 1.28);
          const side = Math.max(0, 1 - distance / 5);
          const direction = Math.sign(delta);
          const x = compact
            ? delta * 24 + Math.sin(delta * 0.9) * 25
            : delta * horizontalSpacing;
          const y = compact
            ? delta * verticalSpacing
            : distance * 8 + state.pointerY * focus * 10;
          const z = focus * 145 - distance * 148;
          const scale = 0.54 + side * 0.15 + focus * 0.54;
          const rotateX = compact ? delta * 2.1 : -state.pointerY * focus * 3.5;
          const rotateY = compact
            ? -delta * 5
            : -direction * (distance > 0.2 ? 14 + Math.min(distance, 3) * 5 : 0) + state.pointerX * focus * 3;
          const rotateZ = compact ? delta * -1.4 : delta * 0.7;

          card.style.setProperty("--focus", focus.toFixed(4));
          card.style.zIndex = String(Math.round(1000 - distance * 100));
          card.style.opacity = String(Math.max(0.13, side * 0.76 + focus * 0.24));
          card.style.filter = `blur(${Math.max(0, distance - 1.5) * 0.38}px)`;
          card.style.transform = [
            "translate(-50%, -50%)",
            `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, ${z.toFixed(2)}px)`,
            `rotateX(${rotateX.toFixed(2)}deg)`,
            `rotateY(${rotateY.toFixed(2)}deg)`,
            `rotateZ(${rotateZ.toFixed(2)}deg)`,
            `scale(${scale.toFixed(4)})`
          ].join(" ");
          card.setAttribute("aria-current", index === activeIndex ? "true" : "false");
        });

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
