<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c120f">
  <title>FlavorCraft — Discover Your Next Dish</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Outfit", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0c120f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0c120f;
    }

    body {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .stage {
      --pointer-x: 50%;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 440px;
      overflow: hidden;
      isolation: isolate;
      perspective: 1450px;
      cursor: ew-resize;
      touch-action: none;
      background:
        radial-gradient(ellipse 75% 65% at var(--pointer-x) 50%, rgba(45, 106, 79, 0.42), rgba(12, 18, 15, 0.95) 72%),
        radial-gradient(circle at 18% 78%, rgba(233, 196, 106, 0.08), transparent 42%),
        radial-gradient(circle at 82% 22%, rgba(116, 198, 157, 0.12), transparent 46%),
        linear-gradient(90deg, rgba(82, 183, 136, 0.05) 1px, transparent 1px) 50% 0 / 20% 100%,
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 99px,
          rgba(82, 183, 136, 0.035) 100px,
          transparent 101px
        ),
        #0c120f;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0.28;
      background:
        repeating-radial-gradient(circle at 14% 16%, rgba(116, 198, 157, 0.2) 0 0.6px, transparent 0.8px 4px),
        repeating-radial-gradient(circle at 84% 68%, rgba(233, 196, 106, 0.22) 0 0.6px, transparent 0.9px 5px);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        rgba(12, 18, 15, 0.98),
        transparent 16%,
        transparent 84%,
        rgba(12, 18, 15, 0.98)
      );
    }

    .deck {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform-style: preserve-3d;
    }

    .card {
      --focus: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(154px, 16.8vw, 238px);
      aspect-ratio: 0.72;
      padding: 7px;
      overflow: hidden;
      border: 1px solid rgba(82, 183, 136, calc(0.28 + var(--focus) * 0.3));
      border-radius: 16px;
      color: #ffffff;
      background: linear-gradient(165deg, #18241e 0%, #111b15 100%);
      box-shadow:
        0 calc(12px + var(--focus) * 26px) calc(20px + var(--focus) * 40px)
          rgba(6, 10, 8, calc(0.6 + var(--focus) * 0.35)),
        0 0 calc(var(--focus) * 24px) rgba(82, 183, 136, calc(var(--focus) * 0.25)),
        inset 0 0 0 1px rgba(116, 198, 157, 0.14);
      appearance: none;
      outline: none;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      cursor: pointer;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 5px;
      z-index: 3;
      border: 1px solid rgba(116, 198, 157, calc(0.1 + var(--focus) * 0.2));
      border-radius: 12px;
      pointer-events: none;
    }

    .card:focus-visible {
      box-shadow:
        0 26px 50px rgba(0, 0, 0, 0.7),
        0 0 0 4px rgba(82, 183, 136, 0.5);
    }

    .portrait {
      position: absolute;
      inset: 7px 7px 25%;
      overflow: hidden;
      border-radius: 10px;
      background: #131d17;
    }

    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(calc(1.04 + (1 - var(--focus)) * 0.06));
      filter:
        saturate(calc(0.95 + var(--focus) * 0.2))
        contrast(1.06);
    }

    .footer {
      position: absolute;
      right: 7px;
      bottom: 7px;
      left: 7px;
      height: calc(25% - 7px);
      display: grid;
      grid-template-columns: clamp(26px, 3.2vw, 43px) 1fr;
      align-items: center;
      gap: clamp(6px, 0.7vw, 11px);
      padding: clamp(7px, 0.8vw, 12px);
      color: #ffffff;
      background: rgba(15, 24, 19, 0.95);
      border: 1px solid rgba(82, 183, 136, 0.15);
      border-radius: 10px;
      text-align: left;
      backdrop-filter: blur(8px);
    }

    .index {
      display: grid;
      width: clamp(23px, 2.7vw, 37px);
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(116, 198, 157, 0.4);
      border-radius: 50%;
      color: #86efac;
      background: rgba(45, 106, 79, 0.35);
      font: 700 clamp(7px, 0.68vw, 11px)/1 ui-monospace, "SFMono-Regular", monospace;
    }

    .meta {
      min-width: 0;
    }

    .name,
    .role {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .name {
      color: #f1f7f4;
      font-size: clamp(8px, 0.86vw, 13px);
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1.1;
    }

    .role {
      margin-top: clamp(3px, 0.35vw, 5px);
      color: #9ab3a6;
      font-size: clamp(5px, 0.48vw, 7.5px);
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 650px) {
      .stage {
        min-height: 560px;
        cursor: ns-resize;
        background:
          radial-gradient(circle at 50% 50%, rgba(45, 106, 79, 0.45), rgba(12, 18, 15, 0.95) 75%),
          radial-gradient(circle at 20% 80%, rgba(233, 196, 106, 0.08), transparent 45%),
          linear-gradient(90deg, rgba(82, 183, 136, 0.05) 1px, transparent 1px) 50% 0 / 50% 100%,
          repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 87px,
            rgba(82, 183, 136, 0.035) 88px,
            transparent 89px
          ),
          #0c120f;
      }

      .card {
        width: clamp(142px, 47vw, 180px);
      }
    }

      .card {
        width: clamp(142px, 47vw, 180px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        will-change: auto;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Interactive FlavorCraft culinary dish filmstrip">
    <h1 class="sr-only">FlavorCraft Culinary Filmstrip</h1>
    <p class="sr-only">Move, scroll, or use the arrow keys to explore signature dishes.</p>
    <div class="deck" id="deck" data-testid="filmstrip"></div>
  </main>

  <script>
    (() => {
      const dishSvg = (bg1, bg2, icon, accent) => `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${bg1}"/><stop offset="100%" stop-color="${bg2}"/></linearGradient></defs><rect width="400" height="400" fill="url(%23g)"/><circle cx="200" cy="200" r="140" fill="%23000000" opacity="0.35"/><circle cx="200" cy="200" r="120" fill="none" stroke="${accent}" stroke-width="4" stroke-dasharray="8 6"/><text x="200" y="225" font-size="100" text-anchor="middle" dominant-baseline="central">${icon}</text></svg>`;

      const defaultPortraits = {
        butter_chicken: {
          src: "https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=800&q=80",
          fallback: dishSvg('%23e65100', '%23ff9800', '🍗', '%23ffe0b2')
        },
        biryani: {
          src: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcThmLTMRCJGx-I5qL4lCn-cdpKkA6rHudyDfg-PnbeBdJTd6S--RFpgfvpt&s=10",
          fallback: dishSvg('%23f57f17', '%23ffb300', '🍛', '%23fff9c4')
        },
        pasta: {
          src: "https://images.unsplash.com/photo-1612874742237-6526221588e3?w=800&q=80",
          fallback: dishSvg('%23c2185b', '%23f06292', '🍝', '%23f8bbd0')
        },
        fried_rice: {
          src: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR2e94pTgkQgjm9gJi4Db-smefe_A5c7ItA9QRmGGUjw6PFLAhRWLjSrAUW&s=10",
          fallback: dishSvg('%23388e3c', '%238bc34a', '🍚', '%23dcedc8')
        },
        paneer_tikka: {
          src: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSjKI-TesyekHpoHOplJ9QkzusR0h8IrvkaeIbEu-r4GQ&s",
          fallback: dishSvg('%23e64a19', '%23ff7043', '🍢', '%23ffccbc')
        },
        palak_paneer: {
          src: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZ3zucaxHuwmSymIQAM2FayuKvJlTWKXaIqTbxo2VTzFcCw10-z0GMQMzu&s=10",
          fallback: dishSvg('%231b5e20', '%234caf50', '🍲', '%23c8e6c9')
        },
        dal_makhani: {
          src: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTSh1A8q-LDvG5h4eMHN2DRvI1G9JIISz4og4qhHDAN9G2Itle-7b1uhNOy&s=10",
          fallback: dishSvg('%234e342e', '%238d6e63', '🥣', '%23d7ccc8')
        },
        omelette: {
          src: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVJOUFM6ouh8pa4JxBVxWf1qGYwtZHbMdkfWIQ6C51--q5tTZ6zXpkk0Q&s=10",
          fallback: dishSvg('%23f57f17', '%23ffb300', '🍳', '%23fff9c4')
        }
      };

      const profiles = (window.__FLAVORCRAFT_ITEMS || [
        ["Restaurant Style Butter Chicken", "Murgh Makhani", "butter_chicken"],
        ["Hyderabadi Chicken Dum Biryani", "Royal Dum Biryani", "biryani"],
        ["Pasta Carbonara", "Italian Classic", "pasta"],
        ["Vegetable Fried Rice", "Wok-Tossed Fragrant", "fried_rice"],
        ["Paneer Tikka Masala", "Tandoori Spiced", "paneer_tikka"],
        ["Palak Paneer", "Spinach Cottage Cheese Curry", "palak_paneer"],
        ["Creamy Dal Makhani", "Slow-Simmered Lentils", "dal_makhani"],
        ["Classic Omelette", "Golden Breakfast Classic", "omelette"]
      ]).map(([name, role, portrait]) => {
        const item = defaultPortraits[portrait] || { src: portrait, fallback: dishSvg('%23333333', '%23111111', '🍽️', '%23ffffff') };
        return {
          name,
          role,
          src: item.src || item,
          fallback: item.fallback || item.src || item
        };
      });

      const stage = document.querySelector("#stage");
      const deck = document.querySelector("#deck");
      const cards = profiles.map((profile, index) => {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.dataset.index = String(index);
        card.setAttribute("aria-label", `Focus ${profile.name}, ${profile.role}`);
        card.innerHTML = `
          <span class="portrait">
            <img src="${profile.src}" alt="${profile.name}" referrerpolicy="no-referrer" crossorigin="anonymous" onerror="this.onerror=null;this.src='${profile.fallback}';">
          </span>
          <span class="footer">
            <span class="index">${String(index + 1).padStart(2, "0")}</span>
            <span class="meta">
              <span class="name">${profile.name}</span>
              <span class="role">${profile.role}</span>
            </span>
          </span>`;
        deck.append(card);
        return card;
      });

      const count = cards.length;
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const state = {
        phase: 3,
        target: 3,
        base: 3,
        pointerX: 0,
        pointerY: 0,
        active: false,
        lastInput: performance.now()
      };

      function wrappedDelta(index, phase) {
        let delta = index - phase;
        while (delta > count / 2) delta -= count;
        while (delta < -count / 2) delta += count;
        return delta;
      }

      function nearestIndex() {
        return (Math.round(state.phase) % count + count) % count;
      }

      function moveTo(index) {
        const current = nearestIndex();
        let delta = index - current;
        if (delta > count / 2) delta -= count;
        if (delta < -count / 2) delta += count;
        state.base += delta;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      }

      cards.forEach((card, index) => {
        card.addEventListener("click", () => moveTo(index));
        card.addEventListener("focus", () => moveTo(index));
      });

      stage.addEventListener("pointermove", (event) => {
        const rect = stage.getBoundingClientRect();
        const nx = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - 0.5) * 2));
        const ny = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - 0.5) * 2));
        state.pointerX = nx;
        state.pointerY = ny;
        state.active = true;
        state.target = state.base + (innerWidth < 650 ? ny * 2.2 : nx * 3.1);
        state.lastInput = performance.now();
        stage.style.setProperty("--pointer-x", `${(nx + 1) * 50}%`);
      });

      stage.addEventListener("pointerleave", () => {
        state.active = false;
        state.pointerX = 0;
        state.pointerY = 0;
        state.target = state.base;
        stage.style.setProperty("--pointer-x", "50%");
      });

      stage.addEventListener("wheel", (event) => {
        event.preventDefault();
        const direction = Math.sign(Math.abs(event.deltaY) > Math.abs(event.deltaX) ? event.deltaY : event.deltaX);
        if (!direction) return;
        state.base += direction;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      }, { passive: false });

      addEventListener("keydown", (event) => {
        const forward = event.key === "ArrowRight" || event.key === "ArrowDown";
        const backward = event.key === "ArrowLeft" || event.key === "ArrowUp";
        if (!forward && !backward) return;
        event.preventDefault();
        state.base += forward ? 1 : -1;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      });

      let previousTime = performance.now();

      function render(time) {
        const deltaTime = Math.min(32, time - previousTime);
        previousTime = time;
        const ease = reducedMotion ? 1 : 1 - Math.pow(0.001, deltaTime / 1000);

        if (!state.active && time - state.lastInput > 3600) {
          const idle = time - state.lastInput - 3600;
          state.target = state.base + Math.sin(idle * 0.00042) * 2.45;
        }

        state.phase += (state.target - state.phase) * ease;
        const compact = innerWidth < 650;
        const activeIndex = nearestIndex();
        const horizontalSpacing = Math.min(168, Math.max(112, innerWidth * 0.116));
        const verticalSpacing = Math.min(122, Math.max(88, innerHeight * 0.112));

        cards.forEach((card, index) => {
          const delta = wrappedDelta(index, state.phase);
          const distance = Math.abs(delta);
          const focus = Math.exp(-distance * distance * 1.28);
          const side = Math.max(0, 1 - distance / 5);
          const direction = Math.sign(delta);
          const x = compact
            ? delta * 24 + Math.sin(delta * 0.9) * 25
            : delta * horizontalSpacing;
          const y = compact
            ? delta * verticalSpacing
            : distance * 8 + state.pointerY * focus * 10;
          const z = focus * 145 - distance * 148;
          const scale = 0.54 + side * 0.15 + focus * 0.54;
          const rotateX = compact ? delta * 2.1 : -state.pointerY * focus * 3.5;
          const rotateY = compact
            ? -delta * 5
            : -direction * (distance > 0.2 ? 14 + Math.min(distance, 3) * 5 : 0) + state.pointerX * focus * 3;
          const rotateZ = compact ? delta * -1.4 : delta * 0.7;

          card.style.setProperty("--focus", focus.toFixed(4));
          card.style.zIndex = String(Math.round(1000 - distance * 100));
          card.style.opacity = String(Math.max(0.13, side * 0.76 + focus * 0.24));
          card.style.filter = `blur(${Math.max(0, distance - 1.5) * 0.38}px)`;
          card.style.transform = [
            "translate(-50%, -50%)",
            `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, ${z.toFixed(2)}px)`,
            `rotateX(${rotateX.toFixed(2)}deg)`,
            `rotateY(${rotateY.toFixed(2)}deg)`,
            `rotateZ(${rotateZ.toFixed(2)}deg)`,
            `scale(${scale.toFixed(4)})`
          ].join(" ");
          card.setAttribute("aria-current", index === activeIndex ? "true" : "false");
        });

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
